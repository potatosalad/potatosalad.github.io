# Site identity
theme: jekyll-theme-chirpy
highlighter: none
lang: en
timezone: America/Chicago

title: potatosalad.io
tagline: ""
description: The development blog of Andrew Bennett
url: "https://potatosalad.io"
canonical_url: "https://potatosalad.io"
baseurl: ""

# Preserve the historical URLs used by links and Disqus.
permalink: /:year/:month/:day/:title

github:
  username: potatosalad

twitter:
  username: potatosaladx

social:
  name: Andrew Bennett
  email: potatosaladx@gmail.com
  links:
    - https://twitter.com/potatosaladx
    - https://github.com/potatosalad

webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

analytics:
  google:
    id: UA-73459380-1
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

pageviews:
  provider:

theme_mode:
cdn:
avatar: /public/apple-touch-icon-precomposed.png
social_preview_image:
toc: true

actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

comments:
  provider: disqus
  disqus:
    shortname: potatosalad
  utterances:
    repo:
    issue_term:
  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:

assets:
  self_host:
    enabled: false
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 5

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /:year/:month/:day/:title
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - .tmp/
  - AGENTS.md
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - justfile
  - LICENSE.md
  - README.md
  - tests/
  - util/
  - vendor/
